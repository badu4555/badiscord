services:
  - type: web
    name: badiscord-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_WS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
